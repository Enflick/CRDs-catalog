name: Sync with upstream

on:
  schedule:
    # Offset from the hour: on-the-hour slots are contended and runs get dropped.
    - cron: '17 6 * * 1'
  workflow_dispatch:

permissions:
  contents: write

# A manual run must not race the scheduled one onto main.
concurrency:
  group: sync-upstream
  cancel-in-progress: false

env:
  UPSTREAM_REPO: https://github.com/datreeio/CRDs-catalog.git
  UPSTREAM_BRANCH: main

jobs:
  sync:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      # Reads the token here only, so it is not in env for the steps that run
      # upstream's code. Slack stays off until the secrets exist.
      - name: Check for Slack credentials
        id: slack
        env:
          TOKEN: ${{ secrets.SLACK_BOT_TOKEN }}
          CHANNEL: ${{ secrets.SLACK_CHANNEL_ID }}
        run: |
          set -euo pipefail
          if [ -n "${TOKEN:-}" ] && [ -n "${CHANNEL:-}" ]; then
            echo "enabled=true" >> "$GITHUB_OUTPUT"
          else
            echo "::notice::SLACK_BOT_TOKEN or SLACK_CHANNEL_ID is not set; skipping Slack."
            echo "enabled=false" >> "$GITHUB_OUTPUT"
          fi

      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          ref: main
          # Full history: the merge-base check below needs it.
          fetch-depth: 0

      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: '3.x'

      - run: python -m pip install --require-hashes --only-binary=":all:" -r .github/scripts/requirements.txt

      - name: Fetch upstream
        id: fetch
        run: |
          set -euo pipefail
          git remote add upstream "$UPSTREAM_REPO"
          git fetch --no-tags upstream "$UPSTREAM_BRANCH"
          if git merge-base --is-ancestor upstream/"$UPSTREAM_BRANCH" HEAD; then
            echo "Already up to date with upstream."
            echo "behind=false" >> "$GITHUB_OUTPUT"
          else
            git log --oneline HEAD..upstream/"$UPSTREAM_BRANCH"
            echo "behind=true" >> "$GITHUB_OUTPUT"
          fi

      - name: Merge upstream
        if: steps.fetch.outputs.behind == 'true'
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          # --no-ff: each sync stays one merge commit, matching this fork's
          # existing sync history and revertible as a unit.
          if ! git merge --no-ff --no-edit upstream/"$UPSTREAM_BRANCH"; then
            conflicts="$(git diff --name-only --diff-filter=U)"
            if [ "$conflicts" != "index.yaml" ]; then
              echo "::error::Upstream sync hit conflicts outside index.yaml. Resolve this merge by hand."
              echo "$conflicts"
              git merge --abort
              exit 1
            fi
            # index.yaml is generated, so neither side is authoritative. Take
            # upstream's and rebuild it from the CRD files in the next step.
            git checkout --theirs index.yaml
            git add index.yaml
            git commit --no-edit
          fi

      - name: Rebuild index.yaml
        if: steps.fetch.outputs.behind == 'true'
        run: |
          set -euo pipefail
          python Utilities/auto-update-index.py . index.yaml
          if git diff --quiet -- index.yaml; then
            echo "index.yaml already matches the CRD files on disk."
          else
            git add index.yaml
            git commit -m 'Updating index.yaml'
          fi

      - name: Push to main
        if: steps.fetch.outputs.behind == 'true'
        run: |
          set -euo pipefail
          git push origin HEAD:main

      - name: Tell Slack the sync landed
        if: steps.fetch.outputs.behind == 'true' && steps.slack.outputs.enabled == 'true'
        uses: Enflick/composite-actions/actions/slack/notify@5791e29a8441b1f479a290c7cc2137b22fe2d096 # v0.8.1
        with:
          bot_token: ${{ secrets.SLACK_BOT_TOKEN }}
          channel_id: ${{ secrets.SLACK_CHANNEL_ID }}
          message: |
            :arrows_counterclockwise: *CRDs-catalog synced with upstream*
            Merged `datreeio/CRDs-catalog` into `main`.
            <${{ github.server_url }}/${{ github.repository }}/commits/main|See what changed> | <${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}|Run log>

      # failure() so this still runs after the step that failed.
      - name: Tell Slack the sync failed
        if: failure() && steps.slack.outputs.enabled == 'true'
        uses: Enflick/composite-actions/actions/slack/notify@5791e29a8441b1f479a290c7cc2137b22fe2d096 # v0.8.1
        with:
          bot_token: ${{ secrets.SLACK_BOT_TOKEN }}
          channel_id: ${{ secrets.SLACK_CHANNEL_ID }}
          message: |
            :x: *CRDs-catalog upstream sync failed*
            `main` was not updated and needs a person. The usual cause is a merge conflict in a CRD schema, which this job refuses to resolve on its own.
            <${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}|Run log>
